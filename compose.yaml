services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estacionamientos
      POSTGRES_PASSWORD: estacionamientos_dev
      POSTGRES_DB: estacionamientos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "estacionamientos", "-d", "estacionamientos"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Canal de correo de prueba: recibe por SMTP en 1025 y muestra los correos en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
